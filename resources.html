<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources — Women's Health Advocacy</title>
<meta name="description" content="Slides, videos, and reading material from WHA meetings and guest speakers." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
/* ===== ADMIN BANNER ===== */
.admin-banner {
  background: var(--deep-rose);
  color: var(--white);
  padding: 12px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 21px;
  font-weight: 500;
}
.admin-banner.hidden { display: none; }
.admin-banner-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.admin-banner-icon {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}
.admin-banner a {
  color: var(--white);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.admin-banner a:hover { color: var(--soft-rose); }
.admin-banner-close {
  background: transparent;
  border: 0;
  color: var(--white);
  cursor: pointer;
  font-size: 27px;
  line-height: 1;
  opacity: 0.7;
  padding: 4px;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.admin-banner-close:hover { opacity: 1; }

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}
.filter-btn {
  padding: 10px 22px;
  border-radius: 999px;
  border: 1.5px solid var(--border-blush);
  background: var(--white);
  color: var(--text-muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 21px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.filter-btn:hover {
  border-color: var(--soft-rose);
  color: var(--deep-rose);
}
.filter-btn.active {
  background: var(--deep-rose);
  border-color: var(--deep-rose);
  color: var(--white);
}

/* ===== RESOURCE GRID ===== */
.resource-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
@media (max-width: 900px) {
  .resource-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .resource-grid { grid-template-columns: 1fr; }
}

.resource-card {
  background: var(--white);
  border-radius: 16px;
  padding: 36px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  border: 1px solid transparent;
}
.resource-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-card-hover);
}
.resource-card.hidden { display: none; }

.resource-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.resource-date {
  font-size: 20px;
  color: var(--text-soft);
}
.resource-card h3 {
  font-family: 'DM Sans', sans-serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.35;
  letter-spacing: -0.01em;
}
.resource-card p {
  font-size: 21px;
  color: var(--text-muted);
  line-height: 1.55;
  flex: 1;
}
.resource-card-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 21px;
  font-weight: 500;
  color: var(--deep-rose);
  margin-top: 4px;
  transition: gap 0.2s ease;
}
.resource-card-link:hover { gap: 10px; color: var(--primary-rose); }

/* Cover image — full-bleed at top of card */
.card-cover {
  width: calc(100% + 72px);
  margin: -36px -36px 20px -36px;
  height: 190px;
  object-fit: cover;
  border-radius: 14px 14px 0 0;
  display: block;
}

/* Type icon */
.type-icon {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: var(--blush);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 24px;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 32px;
  color: var(--text-muted);
}
.empty-state p { font-size: 24px; margin-top: 8px; font-weight: 300; }

.resources-section {
  background: var(--white);
  padding: 80px 80px 120px;
}
</style>
</head>
<body>



<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><img src="WHALogoNoBackground.png" alt="WHA Logo" class="nav-logo-img" />Women's Health Advocacy Club</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="resources.html" class="active">Resources</a></li>
      <li><a href="articles.html">Articles</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="nonprofit.html">Nonprofit</a></li>
    </ul>
  </div>
</nav>

<main>


  <section class="resources-section">
    <div class="container">

      <!-- Filter bar -->
      <div class="filter-bar" id="filterBar" role="group" aria-label="Filter by type">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>

      <!-- Resource cards -->
      <div class="resource-grid" id="resourceGrid">
        <!-- Populated by JS -->
      </div>

    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="footer-logo">Women's Health Advocacy</div>
      <p class="footer-tag">Women's Health Advocacy Club at Westview High School. Education, research, and community action for equity in women's healthcare.</p>
    </div>
    <div class="footer-meta">
      <div>&#169; 2026 Women's Health Advocacy</div>
      <div style="margin-top:6px;">
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="nav.js"></script>
<script>
(function () {
  // Admin banner dismiss
  const banner = document.getElementById('adminBanner');
  const bannerClose = document.getElementById('adminBannerClose');
  if (sessionStorage.getItem('adminBannerDismissed')) {
    banner.classList.add('hidden');
  }
  bannerClose.addEventListener('click', () => {
    banner.classList.add('hidden');
    sessionStorage.setItem('adminBannerDismissed', '1');
  });

  // ── Helpers ──────────────────────────────────────────────────────────────
  const typeEmoji = { Slides: '📊', Video: '▶', Pamphlet: '📄', Reading: '📖', Link: '🔗' };
  function iconFor(type) { return typeEmoji[type] || '📎'; }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Regex-based YAML frontmatter parser — handles quoted and bare values
  function parseFrontmatter(text) {
    const block = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    if (!block) return {};
    const obj = {};
    for (const line of block[1].split('\n')) {
      const m = line.match(/^(\w+):\s*(.*)/);
      if (!m) continue;
      let val = m[2].trim();
      if ((val.startsWith('"') && val.endsWith('"')) ||
          (val.startsWith("'") && val.endsWith("'"))) {
        val = val.slice(1, -1);
      }
      obj[m[1]] = val;
    }
    return obj;
  }

  // ── Data fetching ─────────────────────────────────────────────────────────
  const CONTENTS_API = 'https://api.github.com/repos/AnthonySharf/wha-westview/contents/_data/resources';
  const grid = document.getElementById('resourceGrid');
  const filterBar = document.getElementById('filterBar');
  let resources = [];

  grid.innerHTML = '<div class="empty-state"><p>Loading resources…</p></div>';

  fetch(CONTENTS_API)
    .then(res => {
      if (!res.ok) throw new Error('listing failed');
      return res.json();
    })
    .then(files => {
      const mdFiles = Array.isArray(files) ? files.filter(f => f.name.endsWith('.md')) : [];
      if (mdFiles.length === 0) { showEmpty(); return null; }
      return Promise.all(mdFiles.map(f => fetch(f.download_url).then(r => {
        if (!r.ok) throw new Error('file fetch failed');
        return r.text();
      })));
    })
    .then(texts => {
      if (!texts) return;
      resources = texts
        .map(parseFrontmatter)
        .filter(r => r.title);
      resources.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      buildFilters();
      renderCards('all');
    })
    .catch(() => {
      grid.innerHTML = '<div class="empty-state"><strong>Could not load resources.</strong><p>Please try again later.</p></div>';
    });

  // ── Filter buttons ────────────────────────────────────────────────────────
  function buildFilters() {
    const types = [...new Set(resources.map(r => r.type).filter(Boolean))];
    types.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = t;
      btn.textContent = t;
      filterBar.appendChild(btn);
    });
  }

  function showEmpty() {
    grid.innerHTML = '<div class="empty-state"><strong>No resources yet.</strong><p>No resources yet — check back soon.</p></div>';
  }

  // ── Card rendering ────────────────────────────────────────────────────────
  function renderCards(filter) {
    grid.innerHTML = '';
    const filtered = filter === 'all' ? resources : resources.filter(r => r.type === filter);

    if (filtered.length === 0) {
      showEmpty();
      return;
    }

    filtered.forEach(r => {
      const card = document.createElement('article');
      card.className = 'resource-card';
      card.innerHTML = `
        ${r.image ? `<img class="card-cover" src="${esc(r.image)}" alt="${esc(r.title)}">` : ''}
        <div class="resource-card-top">
          <span class="badge badge-line">${esc(r.type)}</span>
          <span class="resource-date">${esc(r.date)}</span>
        </div>
        ${!r.image ? `<div class="type-icon" aria-hidden="true">${iconFor(r.type)}</div>` : ''}
        <h3>${esc(r.title)}</h3>
        <p>${esc(r.description)}</p>
        <a class="resource-card-link" href="${esc(r.link || '#')}" target="_blank" rel="noopener">
          Open resource <span aria-hidden="true">&#8594;</span>
        </a>
      `;
      grid.appendChild(card);
    });
  }

  filterBar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
})();
</script>
</body>
</html>
